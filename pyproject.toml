[project]
name = "foveal"
version = "0.0.1"
description = "Multimodal working memory for agents: perceive once, reference cheaply, zoom on demand."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Shubham Tiwari" }]
dependencies = ["pillow>=10", "imagehash>=4.3"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
bench = ["anthropic>=0.70", "pymupdf>=1.24", "pyarrow>=15", "huggingface_hub>=0.24", "matplotlib>=3.8", "python-dotenv>=1.0"]
report = ["matplotlib>=3.8"]
ocr = [
    "pytesseract>=0.3",
]
pdf = ["pymupdf>=1.24"]
video = [
    "av>=12",
]
redis = [
    "redis>=5",
]

[project.scripts]
foveal = "foveal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foveal"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
